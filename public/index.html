<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jobtavle</title>
<style>
  :root {
    --bg: #faf6f0;
    --card: #ffffff;
    --ink: #2b2622;
    --muted: #8a7f74;
    --line: #e7ddd1;
    --accent: #b5532f;
    --accent-soft: #f3e4db;
    --shadow: 0 1px 2px rgba(43, 38, 34, 0.06);
    /* status-farver */
    --st-interesseret: #2f7d4f;
    --st-interesseret-soft: #e2f0e7;
    --st-ansøgt: #2f5fb5;
    --st-ansøgt-soft: #e1e9f6;
    --st-samtale: #8a5cc4;
    --st-samtale-soft: #ece2f6;
    --st-afvist: #9a8f84;
    --st-afvist-soft: #efe9e2;
    /* match-score (jordnaere toner) */
    --sc-staerk: #5f7d4a;
    --sc-middel: #c58a3e;
    --sc-svag: #cabcae;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  header {
    padding: 28px 16px 12px;
    max-width: 820px;
    margin: 0 auto;
  }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; }
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .toggle-afviste {
    font-size: 13px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--muted);
    padding: 5px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  .toggle-afviste:hover { border-color: var(--accent); color: var(--ink); }
  .toggle-afviste.aktiv { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  /* sorterings-skifter: Nyeste foerst / Bedste match foerst */
  .sorter {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 999px;
    overflow: hidden;
    background: var(--card);
  }
  .sort-btn {
    font-size: 13px;
    font-family: inherit;
    border: none;
    background: transparent;
    color: var(--muted);
    padding: 5px 13px;
    cursor: pointer;
  }
  .sort-btn:hover { color: var(--ink); }
  .sort-btn.aktiv { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  main { max-width: 820px; margin: 0 auto; padding: 8px 16px 48px; }
  .bane-group { margin-top: 24px; }
  .bane-head {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
    font-weight: 700;
    margin: 0 0 8px;
  }
  .job {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    box-shadow: var(--shadow);
    display: flex;
    gap: 12px;
    align-items: flex-start;
    justify-content: space-between;
  }
  /* venstre farvekant skifter med status */
  .job[data-status="interesseret"] { border-left-color: var(--st-interesseret); }
  .job[data-status="ansøgt"] { border-left-color: var(--st-ansøgt); }
  .job[data-status="til samtale"] { border-left-color: var(--st-samtale); }
  .job[data-status="ingen interesse"] { border-left-color: var(--st-afvist); opacity: 0.72; }
  /* match-prik til venstre for titlen */
  .score-prik {
    width: 9px; height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 6px;
    background: var(--sc-svag);
  }
  .score-prik[data-niveau="staerk"] { background: var(--sc-staerk); }
  .score-prik[data-niveau="middel"] { background: var(--sc-middel); }
  /* bane-mærkat (vises i "Bedste match"-visningen, hvor banerne ikke er grupperet) */
  .bane-tag {
    display: inline-block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 0 7px;
    border-radius: 999px;
    margin-right: 6px;
  }
  /* signal-linje: score + hvilke ord den bygger paa */
  .signal {
    margin-top: 5px;
    font-size: 11.5px;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    gap: 3px 6px;
    align-items: baseline;
  }
  .signal .score-tal { font-weight: 600; color: var(--ink); }
  .signal .ord-loeft { color: var(--sc-staerk); }
  .signal .ord-saenk { color: #a23e2a; }
  .signal .ingen { font-style: italic; }
  .job-venstre { min-width: 0; flex: 1; }
  .job-link { text-decoration: none; color: inherit; display: block; min-width: 0; }
  .job-link:hover .job-titel { color: var(--accent); }
  .job-titel { font-weight: 600; font-size: 15px; }
  .job-meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .job-hoejre { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .status-badge {
    display: inline-block;
    font-size: 11px;
    padding: 1px 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    white-space: nowrap;
  }
  .status-badge[data-status="interesseret"] { background: var(--st-interesseret-soft); color: var(--st-interesseret); }
  .status-badge[data-status="ansøgt"] { background: var(--st-ansøgt-soft); color: var(--st-ansøgt); }
  .status-badge[data-status="til samtale"] { background: var(--st-samtale-soft); color: var(--st-samtale); }
  .status-badge[data-status="ingen interesse"] { background: var(--st-afvist-soft); color: var(--st-afvist); }
  select.status-vaelger {
    font-size: 12px;
    font-family: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 3px 6px;
    cursor: pointer;
  }
  select.status-vaelger:hover { border-color: var(--accent); }
  select.status-vaelger:disabled { opacity: 0.5; cursor: default; }
  .msg {
    margin-top: 24px;
    padding: 16px;
    border-radius: 10px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--muted);
  }
  .msg.error { border-left: 3px solid var(--accent); color: var(--ink); }
  code { background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; font-size: 13px; }

  /* "Byg CV"-knap pr. jobkort */
  .byg-cv-btn {
    font-size: 12px;
    font-family: inherit;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    border-radius: 8px;
    padding: 3px 10px;
    cursor: pointer;
    white-space: nowrap;
  }
  .byg-cv-btn:hover { background: #9e4728; border-color: #9e4728; }
  .byg-cv-btn:active { transform: translateY(1px); }

  /* lille bekraeftelse nederst */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    background: var(--ink);
    color: #fff;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 14px;
    box-shadow: 0 4px 14px rgba(43, 38, 34, 0.22);
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .toast.vis { opacity: 1; }

  /* fallback: manuel kopi-boks hvis automatisk kopiering ikke kan */
  .kopi-overlay {
    position: fixed; inset: 0;
    background: rgba(43, 38, 34, 0.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 60; padding: 16px;
  }
  .kopi-boks {
    background: var(--card);
    border-radius: 12px;
    padding: 18px;
    max-width: 560px; width: 100%;
    box-shadow: 0 8px 30px rgba(43, 38, 34, 0.25);
  }
  .kopi-boks h3 { margin: 0 0 6px; font-size: 16px; }
  .kopi-boks p { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
  .kopi-boks textarea {
    width: 100%; height: 220px;
    font-family: inherit; font-size: 13px;
    border: 1px solid var(--line); border-radius: 8px;
    padding: 10px; resize: vertical;
  }
  .kopi-boks .luk {
    margin-top: 10px;
    border: 1px solid var(--line);
    background: var(--bg); color: var(--ink);
    padding: 6px 14px; border-radius: 8px; cursor: pointer;
    font-family: inherit; font-size: 13px;
  }
  .kopi-boks .luk:hover { border-color: var(--accent); }
</style>
</head>
<body>
  <header>
    <h1>Jobtavle</h1>
    <div class="sub" id="sub">Henter job ...</div>
    <div class="topbar">
      <div class="sorter" id="sorter">
        <button class="sort-btn aktiv" data-sort="nyeste" type="button">Nyeste først</button>
        <button class="sort-btn" data-sort="match" type="button">Bedste match først</button>
      </div>
      <button class="toggle-afviste" id="toggleAfviste" type="button">Vis afviste</button>
    </div>
  </header>
  <main id="main"></main>

<script>
  // CV-projektet paa claude.ai. "Byg CV" aabner denne i en ny fane.
  // Ret den ene linje her hvis projekt-URL'en er en anden.
  const PROJEKT_URL = "https://claude.ai/project/01a0d762-8e95-70b9-b0fd-8c6ea16802c3";

  const BANE_NAVN = {
    fm: "Facility Management",
    "indkøb": "Indkøb",
    hr: "HR",
    koordinator: "Koordinator",
  };

  // Status-valgmuligheder i dropdownen. Vaerdien skal matche server + database.
  const STATUS_VALG = [
    { v: "ny", t: "Ny" },
    { v: "interesseret", t: "Interesseret" },
    { v: "ansøgt", t: "Ansøgt" },
    { v: "til samtale", t: "Til samtale" },
    { v: "ingen interesse", t: "Ingen interesse" },
  ];
  const STATUS_TEKST = Object.fromEntries(STATUS_VALG.map((s) => [s.v, s.t]));

  let alleJobs = [];
  let visAfviste = false;
  let sorterMode = "nyeste"; // "nyeste" (som hidtil) eller "match"

  // Oversaetter score til et niveau for prik-farven. Taersklerne er lette at
  // justere her.
  function scoreNiveau(s) {
    if (s == null) return "svag";
    if (s >= 8) return "staerk";
    if (s >= 1) return "middel";
    return "svag";
  }

  // Lille linje der viser score + hvilke ord den bygger paa.
  function signalLinje(j) {
    const dele = ['<span class="score-tal">Match ' + (j.score == null ? "-" : j.score) + "</span>"];
    (j.loeft || []).forEach((o) => dele.push('<span class="ord-loeft">' + esc(o) + "</span>"));
    (j.saenk || []).forEach((o) => dele.push('<span class="ord-saenk">− ' + esc(o) + "</span>"));
    if ((!j.loeft || j.loeft.length === 0) && (!j.saenk || j.saenk.length === 0)) {
      dele.push('<span class="ingen">ingen nøgleord</span>');
    }
    return '<div class="signal">' + dele.join("") + "</div>";
  }

  function fmtDato(s) {
    if (!s) return "";
    const d = new Date(s);
    if (isNaN(d)) return "";
    return d.toLocaleDateString("da-DK", { day: "numeric", month: "short" });
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // Bygger den tekst Torben paster ind i CV-projektet for at starte FASE 1.
  // fuldtekst/kilde er med, naar serveren kunne hente hele opslaget; ellers
  // bruges RSS-uddraget.
  function bygFase1Tekst(j, fuldtekst, kilde) {
    const baneNavn = BANE_NAVN[j.bane] || j.bane || "";
    const L = [];
    L.push("Ny jobsag - start venligst FASE 1.");
    L.push("");
    L.push("Stilling: " + (j.titel || "(ingen titel)"));
    L.push("Virksomhed: " + (j.virksomhed ? j.virksomhed : "(fremgår af opslaget)"));
    if (baneNavn) L.push("Bane: " + baneNavn);
    if (j.url) L.push("Jobopslag (Jobindex): " + j.url);
    if (kilde) L.push("Fuldt opslag: " + kilde);
    L.push("");
    if (fuldtekst) {
      L.push("--- Fuldt jobopslag ---");
      L.push(fuldtekst);
    } else if (j.raw_tekst) {
      L.push("Uddrag fra opslaget (kun RSS - hele opslaget ligger bag linket):");
      L.push(j.raw_tekst);
    }
    return L.join("\n");
  }

  // Kopiering der ogsaa virker paa http (ikke secure context), hvor
  // navigator.clipboard typisk ikke er tilgaengelig. Returnerer true/false.
  function kopierTekst(tekst) {
    // execCommand er synkront og virker paa http - foretrukket her.
    try {
      const ta = document.createElement("textarea");
      ta.value = tekst;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, tekst.length);
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      if (ok) return true;
    } catch (e) { /* falder igennem til fallback */ }
    return false;
  }

  let toastTimer = null;
  function visToast(tekst) {
    let el = document.getElementById("toast");
    if (!el) {
      el = document.createElement("div");
      el.id = "toast";
      el.className = "toast";
      document.body.appendChild(el);
    }
    el.textContent = tekst;
    // force reflow saa transition koerer hver gang
    void el.offsetWidth;
    el.classList.add("vis");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("vis"), 2600);
  }

  // Sidste udvej: vis teksten saa den kan markeres og kopieres i haanden.
  function visManuelKopi(tekst) {
    const overlay = document.createElement("div");
    overlay.className = "kopi-overlay";
    const boks = document.createElement("div");
    boks.className = "kopi-boks";
    const h = document.createElement("h3");
    h.textContent = "Kopiér teksten";
    const p = document.createElement("p");
    p.textContent = "Automatisk kopiering gik ikke. Markér alt (teksten er valgt) og tryk Ctrl/Cmd+C.";
    const ta = document.createElement("textarea");
    ta.value = tekst;
    ta.setAttribute("readonly", "");
    const luk = document.createElement("button");
    luk.className = "luk";
    luk.textContent = "Luk";
    luk.addEventListener("click", () => document.body.removeChild(overlay));
    overlay.addEventListener("click", (e) => { if (e.target === overlay) document.body.removeChild(overlay); });
    boks.appendChild(h); boks.appendChild(p); boks.appendChild(ta); boks.appendChild(luk);
    overlay.appendChild(boks);
    document.body.appendChild(overlay);
    ta.focus();
    ta.select();
  }

  // Henter det fulde opslag fra serveren (med klient-timeout). null hvis det
  // ikke kunne lade sig goere - saa falder vi tilbage til RSS-uddraget.
  async function hentFuldtOpslag(id) {
    const ac = new AbortController();
    const t = setTimeout(() => ac.abort(), 20000);
    try {
      const r = await fetch("/api/jobs/" + id + "/opslag", { signal: ac.signal });
      const d = await r.json();
      if (d && d.ok && d.fuldtekst) return { fuldtekst: d.fuldtekst, kilde: d.kilde };
    } catch (e) { /* falder tilbage */ }
    finally { clearTimeout(t); }
    return null;
  }

  async function bygCV(j, btn) {
    // Aabn projektet straks paa klik-tick (undgaar popup-blokering),
    // mens vi henter opslaget.
    if (PROJEKT_URL) window.open(PROJEKT_URL, "_blank", "noopener");

    const orgTekst = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Henter ...";

    const fuld = await hentFuldtOpslag(j.id);

    btn.disabled = false;
    btn.textContent = orgTekst;

    const tekst = bygFase1Tekst(j, fuld && fuld.fuldtekst, fuld && fuld.kilde);
    const ok = kopierTekst(tekst);

    if (ok) {
      visToast(fuld
        ? "Fuldt opslag hentet og kopieret - paste i CV-projektet"
        : "Uddrag kopieret (hele opslaget kunne ikke hentes) - paste i CV-projektet");
    } else {
      visManuelKopi(tekst);
    }
  }

  async function saetStatus(id, nyStatus, selectEl) {
    selectEl.disabled = true;
    try {
      const r = await fetch("/api/jobs/" + id + "/status", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status: nyStatus }),
      });
      const data = await r.json();
      if (!data.ok) throw new Error(data.error || "ukendt fejl");
      // Opdatér lokal kopi og tegn om, saa afviste evt. forsvinder/dukker op.
      const job = alleJobs.find((j) => String(j.id) === String(id));
      if (job) job.status = nyStatus;
      tegn();
    } catch (e) {
      selectEl.disabled = false;
      alert("Kunne ikke gemme status: " + e.message);
    }
  }

  function jobKort(j, visBane) {
    const status = j.status || "ny";
    const niveau = scoreNiveau(j.score);
    const visBadge = status !== "ny";

    const metaBits = [j.virksomhed, fmtDato(j.oprettet)].filter(Boolean).join(" · ");
    const baneTag = visBane
      ? '<span class="bane-tag">' + esc(BANE_NAVN[j.bane] || j.bane || "") + "</span>"
      : "";
    const metaHtml = (baneTag || metaBits)
      ? '<div class="job-meta">' + baneTag + esc(metaBits) + "</div>"
      : "";

    const wrap = document.createElement("div");
    wrap.className = "job";
    wrap.setAttribute("data-status", status);

    const prik =
      '<span class="score-prik" data-niveau="' + niveau +
      '" title="Match-score: ' + (j.score == null ? "-" : j.score) + '"></span>';

    const venstre =
      '<a class="job-link" href="' + esc(j.url || "#") + '" target="_blank" rel="noopener">' +
      '<div class="job-titel">' + esc(j.titel || "(uden titel)") + "</div>" +
      metaHtml +
      "</a>" +
      signalLinje(j);

    const optioner = STATUS_VALG.map(
      (s) => '<option value="' + s.v + '"' + (s.v === status ? " selected" : "") + ">" + s.t + "</option>"
    ).join("");

    const hoejre =
      '<div class="job-hoejre">' +
      (visBadge ? '<span class="status-badge" data-status="' + status + '">' + STATUS_TEKST[status] + "</span>" : "") +
      '<select class="status-vaelger">' + optioner + "</select>" +
      '<button class="byg-cv-btn" type="button">Byg CV</button>' +
      "</div>";

    wrap.innerHTML = prik + '<div class="job-venstre">' + venstre + "</div>" + hoejre;

    const sel = wrap.querySelector("select.status-vaelger");
    sel.addEventListener("change", () => saetStatus(j.id, sel.value, sel));

    const bygBtn = wrap.querySelector("button.byg-cv-btn");
    bygBtn.addEventListener("click", () => bygCV(j, bygBtn));

    return wrap;
  }

  function tegn() {
    const main = document.getElementById("main");
    const sub = document.getElementById("sub");
    main.innerHTML = "";

    // Afviste skjules medmindre knappen er slaaet til.
    const synlige = alleJobs.filter(
      (j) => visAfviste || (j.status || "ny") !== "ingen interesse"
    );
    const antalAfviste = alleJobs.filter((j) => (j.status || "ny") === "ingen interesse").length;

    sub.textContent =
      synlige.length + " job" + (antalAfviste ? "  ·  " + antalAfviste + " afvist" : "");

    if (synlige.length === 0) {
      main.innerHTML = '<div class="msg">Ingen job at vise.</div>';
      return;
    }

    // "Bedste match først": én flad liste, hoejeste score oeverst. Intet
    // skjules - de svage ligger bare nederst. Bane vises som maerkat paa kortet.
    if (sorterMode === "match") {
      const sorteret = synlige.slice().sort(
        (a, b) => (b.score || 0) - (a.score || 0) ||
                  (new Date(b.oprettet) - new Date(a.oprettet))
      );
      const sec = document.createElement("section");
      sec.className = "bane-group";
      for (const j of sorteret) sec.appendChild(jobKort(j, true));
      main.appendChild(sec);
      return;
    }

    // "Nyeste først" (standard): grupperet efter bane, nyeste oeverst.
    const orden = ["fm", "indkøb", "hr", "koordinator"];
    const grupper = {};
    for (const j of synlige) {
      const b = j.bane || "andet";
      (grupper[b] = grupper[b] || []).push(j);
    }
    const baner = orden.filter((b) => grupper[b]).concat(
      Object.keys(grupper).filter((b) => !orden.includes(b))
    );

    for (const b of baner) {
      const sec = document.createElement("section");
      sec.className = "bane-group";
      const h = document.createElement("h2");
      h.className = "bane-head";
      h.textContent = BANE_NAVN[b] || b;
      sec.appendChild(h);
      for (const j of grupper[b]) sec.appendChild(jobKort(j, false));
      main.appendChild(sec);
    }
  }

  async function load() {
    const main = document.getElementById("main");
    const sub = document.getElementById("sub");
    try {
      const r = await fetch("/api/jobs");
      const data = await r.json();

      if (!data.ok) {
        sub.textContent = "Kunne ikke hente job";
        main.innerHTML =
          '<div class="msg error"><strong>Databasen svarede ikke.</strong><br>' +
          "Fejl: <code>" + esc(data.error || "ukendt") + "</code></div>";
        return;
      }

      alleJobs = data.jobs || [];
      if (alleJobs.length === 0) {
        sub.textContent = "0 job i databasen";
        main.innerHTML = '<div class="msg">Ingen job i databasen endnu.</div>';
        return;
      }
      tegn();
    } catch (e) {
      sub.textContent = "Kunne ikke hente job";
      main.innerHTML =
        '<div class="msg error"><strong>Siden kunne ikke tale med serveren.</strong><br>' +
        "Fejl: <code>" + esc(e.message) + "</code></div>";
    }
  }

  document.getElementById("toggleAfviste").addEventListener("click", function () {
    visAfviste = !visAfviste;
    this.classList.toggle("aktiv", visAfviste);
    this.textContent = visAfviste ? "Skjul afviste" : "Vis afviste";
    tegn();
  });

  document.getElementById("sorter").addEventListener("click", function (e) {
    const btn = e.target.closest(".sort-btn");
    if (!btn) return;
    sorterMode = btn.getAttribute("data-sort");
    this.querySelectorAll(".sort-btn").forEach((b) => b.classList.toggle("aktiv", b === btn));
    tegn();
  });

  load();
</script>
</body>
</html>
