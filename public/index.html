<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jobtavle</title>
<style>
  :root {
    --bg: #faf6f0;
    --card: #ffffff;
    --ink: #2b2622;
    --muted: #8a7f74;
    --line: #e7ddd1;
    --accent: #b5532f;
    --accent-soft: #f3e4db;
    --shadow: 0 1px 2px rgba(43, 38, 34, 0.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  header {
    padding: 28px 16px 12px;
    max-width: 820px;
    margin: 0 auto;
  }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; }
  main { max-width: 820px; margin: 0 auto; padding: 8px 16px 48px; }
  .bane-group { margin-top: 24px; }
  .bane-head {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
    font-weight: 700;
    margin: 0 0 8px;
  }
  .job {
    display: block;
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    text-decoration: none;
    color: inherit;
    box-shadow: var(--shadow);
  }
  .job:hover { border-color: var(--accent); }
  .job-titel { font-weight: 600; font-size: 15px; }
  .job-meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .status {
    display: inline-block;
    font-size: 11px;
    padding: 1px 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    margin-left: 6px;
    vertical-align: middle;
  }
  .msg {
    margin-top: 24px;
    padding: 16px;
    border-radius: 10px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--muted);
  }
  .msg.error { border-left: 3px solid var(--accent); color: var(--ink); }
  code { background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
</style>
</head>
<body>
  <header>
    <h1>Jobtavle</h1>
    <div class="sub" id="sub">Henter job ...</div>
  </header>
  <main id="main"></main>

<script>
  const BANE_NAVN = {
    fm: "Facility Management",
    "indkøb": "Indkøb",
    hr: "HR",
    koordinator: "Koordinator",
  };

  function fmtDato(s) {
    if (!s) return "";
    const d = new Date(s);
    if (isNaN(d)) return "";
    return d.toLocaleDateString("da-DK", { day: "numeric", month: "short" });
  }

  async function load() {
    const main = document.getElementById("main");
    const sub = document.getElementById("sub");
    try {
      const r = await fetch("/api/jobs");
      const data = await r.json();

      if (!data.ok) {
        sub.textContent = "Kunne ikke hente job";
        main.innerHTML =
          '<div class="msg error"><strong>Databasen svarede ikke.</strong><br>' +
          "Fejl: <code>" + (data.error || "ukendt") + "</code></div>";
        return;
      }

      const jobs = data.jobs || [];
      sub.textContent = jobs.length + " job i databasen";

      if (jobs.length === 0) {
        main.innerHTML = '<div class="msg">Ingen job i databasen endnu.</div>';
        return;
      }

      // Gruppér efter bane i fast rækkefølge.
      const orden = ["fm", "indkøb", "hr", "koordinator"];
      const grupper = {};
      for (const j of jobs) {
        const b = j.bane || "andet";
        (grupper[b] = grupper[b] || []).push(j);
      }

      let html = "";
      const baner = orden.filter((b) => grupper[b]).concat(
        Object.keys(grupper).filter((b) => !orden.includes(b))
      );

      for (const b of baner) {
        html += '<section class="bane-group">';
        html += '<h2 class="bane-head">' + (BANE_NAVN[b] || b) + "</h2>";
        for (const j of grupper[b]) {
          const meta = [j.virksomhed, fmtDato(j.oprettet)].filter(Boolean).join(" · ");
          const status =
            j.status && j.status !== "ny"
              ? '<span class="status">' + j.status + "</span>"
              : "";
          html +=
            '<a class="job" href="' + (j.url || "#") + '" target="_blank" rel="noopener">' +
            '<div class="job-titel">' + (j.titel || "(uden titel)") + status + "</div>" +
            (meta ? '<div class="job-meta">' + meta + "</div>" : "") +
            "</a>";
        }
        html += "</section>";
      }
      main.innerHTML = html;
    } catch (e) {
      sub.textContent = "Kunne ikke hente job";
      main.innerHTML =
        '<div class="msg error"><strong>Siden kunne ikke tale med serveren.</strong><br>' +
        "Fejl: <code>" + e.message + "</code></div>";
    }
  }

  load();
</script>
</body>
</html>
